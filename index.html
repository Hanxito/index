<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahorcado YachayTECH</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: white;
        text-align: center;
        background-color: #0b132b;
        overflow-x: hidden;
    }

    /* PORTADA */
    #portada {
        position: fixed;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10;
    }

    #portada::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
    }

    .titulo {
        font-size: clamp(2.5em, 6vw, 4em);
        z-index: 2;
        animation: glow 2s infinite alternate;
        margin-bottom: 5px;
    }

    .subtitulo {
        z-index: 2;
        font-size: 1.2em;
        margin-bottom: 30px;
        color: #00c6ff;
    }

    #btnStart {
        z-index: 2;
        padding: 15px 45px;
        font-size: 22px;
        font-weight: bold;
        background: #00c6ff;
        color: #0b132b;
        border: none;
        border-radius: 50px;
        transition: 0.3s;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(0, 198, 255, 0.5);
    }

    #btnStart:hover {
        transform: scale(1.1);
        background: #00ffcc;
    }

    @keyframes glow {
        from { text-shadow: 0 0 10px #00c6ff; }
        to { text-shadow: 0 0 25px #00ffcc; }
    }

    /* CONTENEDORES */
    .container {
        position: relative;
        z-index: 2;
        max-width: 900px;
        margin: 20px auto;
        padding: 20px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(8px);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* MENU CARDS */
    #menu {
        display: none;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
    }

    .card {
        background: rgba(0, 198, 255, 0.1);
        padding: 20px;
        border-radius: 15px;
        cursor: pointer;
        transition: 0.3s;
        width: 160px;
        border: 1px solid rgba(0, 198, 255, 0.2);
        font-weight: bold;
    }

    .card:hover {
        background: #00c6ff;
        color: #0b132b;
        transform: translateY(-5px);
    }

    /* GAME UI */
    #game {
        display: none;
    }

    #palabra {
        font-size: clamp(22px, 5vw, 40px);
        letter-spacing: 10px;
        margin: 25px;
        font-family: 'Courier New', Courier, monospace;
        color: #00ffcc;
    }

    canvas {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 15px;
    }

    .btn-accion {
        padding: 12px 25px;
        border-radius: 10px;
        border: none;
        margin: 10px;
        cursor: pointer;
        font-weight: bold;
    }

    .btn-pista { background: #ffd700; color: #333; }
    .btn-volver { background: #ff4d4d; color: white; }

    #letras {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-top: 20px;
    }

    #letras button {
        width: 45px;
        height: 45px;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
    }

    #letras button:disabled {
        opacity: 0.2;
        cursor: not-allowed;
    }

    #particles-js {
        position: fixed;
        width: 100%;
        height: 100%;
        z-index: 0;
    }
</style>
</head>

<body>

<div id="particles-js"></div>

<div id="portada">
    <h1 class="titulo">🎓 Ahorcado YachayTECH</h1>
    <p class="subtitulo">Versión Académica Ampliada</p>
    <button id="btnStart" onclick="entrarJuego()">🚀 COMENZAR</button>
</div>

<h1 style="margin-top: 30px; position: relative; z-index: 2;">Ahorcado YachayTECH</h1>

<div class="container" id="menu"></div>

<div class="container" id="game">
    <h2 id="categoria" style="color: #00c6ff;"></h2>
    <canvas id="canvas" width="220" height="260"></canvas>
    <div id="palabra"></div>
    <div id="info"></div>

    <button class="btn-accion btn-pista" onclick="darPista()">💡 Pista (-15 pts)</button>
    <button class="btn-accion btn-volver" onclick="volverMenu()">⬅ Menú</button>

    <div id="letras"></div>
</div>

<audio id="winSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>
<audio id="goodSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="badSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<script>
const data = {
    "Física": [
        "energia", "fuerza", "onda", "campo", "relatividad", "cuantica", "vector", "masa", "frecuencia", "inercia",
        "entropia", "gravedad", "foton", "electron", "proton", "neutron", "atomo", "galaxia", "mecanica", "fluido",
        "presion", "calor", "optica", "sonido", "magnetismo", "potencia", "torque", "friccion", "impulso", "aceleracion"
    ],
    "Matemáticas": [
        "derivada", "integral", "limite", "matriz", "vector", "ecuacion", "teorema", "logaritmo", "serie", "gradiente",
        "algebra", "calculo", "geometria", "fraccion", "decimal", "angulo", "triangulo", "circulo", "poligono", "perimetro",
        "area", "volumen", "sucesion", "conjunto", "logica", "axioma", "lema", "infinito", "asintota", "probabilidad"
    ],
    "Biología": [
        "celula", "adn", "mitosis", "ecosistema", "enzima", "organismo", "evolucion", "mutacion", "tejido", "bacteria",
        "genetica", "biodiversidad", "fotosintesis", "respiracion", "nutricion", "reproduccion", "herencia", "natural", "taxonomia", "especie",
        "poblacion", "comunidad", "bioma", "organo", "sistema", "hormona", "proteina", "lipido", "glucido", "vitamina"
    ],
    "Química": [
        "atomo", "molecula", "reaccion", "ion", "valencia", "entalpia", "entropia", "orbital", "redox", "polimero",
        "enlace", "covalente", "ionico", "disolucion", "molaridad", "ph", "acido", "base", "oxido", "hidroxido",
        "gas", "liquido", "solido", "plasma", "destilacion", "filtracion", "reactor", "catalizador", "isotopo", "estequiometria"
    ],
    "Programación": [
        "python", "variable", "funcion", "bucle", "array", "objeto", "clase", "algoritmo", "debug", "constante",
        "booleano", "entero", "flotante", "cadena", "lista", "tupla", "diccionario", "metodo", "herencia", "polimorfismo",
        "abstraccion", "interfaz", "modulo", "paquete", "libreria", "framework", "consulta", "servidor", "cliente", "backend"
    ],
    "Agroindustria": [
        "fermentacion", "pasteurizacion", "inocuidad", "trazabilidad", "enzima", "alimento", "nutriente", "conservacion", "envasado", "higiene",
        "molienda", "refinacion", "extraccion", "deshidratacion", "liofilizacion", "arroz", "trigo", "maiz", "cebada", "avena", "quinua", "soja", 
        "lenteja", "garbanzo", "frijol", "papa", "yuca", "camote", "zanahoria", "remolacha", "cebolla", "ajo", "lechuga", "espinaca", "brocoli", 
        "coliflor", "tomate", "pepino", "pimiento", "calabaza", "sandia", "melon", "platano", "manzana", "uva" "esterilizacion"
    ],
    "Ingeniería": [
        "estructura", "sistema", "circuito", "control", "sensor", "motor", "material", "diseño", "plano", "prototipo",
        "resistencia", "industrial", "civil", "ambiental", "gestion", "calidad", "seguridad", "mantenimiento", "operacion", "proceso",
        "optimizacion", "simulacion", "analisis", "sintesis", "evaluacion", "proyecto", "costo", "tiempo", "recurso", "eficiencia"
    ]
};

let palabra = "";
let letras = [];
let intentos = 6;
let puntaje = 0;
let nivel = 1;
let categoriaActual = "";

function entrarJuego() {
    document.getElementById("portada").style.display = "none";
    document.getElementById("menu").style.display = "flex";
}

function crearMenu() {
    const menu = document.getElementById("menu");
    menu.innerHTML = "";
    for (let cat in data) {
        let card = document.createElement("div");
        card.className = "card";
        card.innerText = cat;
        card.onclick = () => iniciarJuego(cat);
        menu.appendChild(card);
    }
}

function elegirPalabra(lista) {
    let filtrada = [];
    if (nivel <= 2) filtrada = lista.filter(p => p.length <= 6);
    else if (nivel <= 5) filtrada = lista.filter(p => p.length > 6 && p.length <= 9);
    else filtrada = lista.filter(p => p.length > 9);

    if (filtrada.length === 0) filtrada = lista; 
    return filtrada[Math.floor(Math.random() * filtrada.length)];
}

function iniciarJuego(cat) {
    categoriaActual = cat;
    palabra = elegirPalabra(data[cat]);
    letras = [];
    intentos = 6;

    document.getElementById("menu").style.display = "none";
    document.getElementById("game").style.display = "block";
    document.getElementById("categoria").innerText = cat;

    crearTeclado();
    actualizar();
}

function crearTeclado() {
    const cont = document.getElementById("letras");
    cont.innerHTML = "";
    const alfabet = "abcdefghijklmnopqrstuvwxyz";
    for (let l of alfabet) {
        let b = document.createElement("button");
        b.innerText = l;
        b.id = "key-" + l;
        b.onclick = () => {
            b.disabled = true;
            intentar(l);
        };
        cont.appendChild(b);
    }
}

function intentar(l) {
    if (letras.includes(l)) return;
    letras.push(l);

    if (!palabra.includes(l)) {
        intentos--;
        document.getElementById("badSound").play();
    } else {
        document.getElementById("goodSound").play();
    }

    actualizar();
    comprobar();
}

function actualizar() {
    let m = palabra.split("").map(l => letras.includes(l) ? l : "_").join(" ");
    document.getElementById("palabra").innerText = m;
    document.getElementById("info").innerHTML = `<b>Puntaje:</b> ${puntaje} | <b>Nivel:</b> ${nivel} | <b>Vidas:</b> ${intentos}`;
    dibujar();
}

function comprobar() {
    if (!document.getElementById("palabra").innerText.includes("_")) {
        document.getElementById("winSound").play();
        puntaje += (palabra.length * 5) + (intentos * 2);
        nivel++;
        setTimeout(() => {
            alert("¡Excelente! Palabra completada.");
            iniciarJuego(categoriaActual);
        }, 400);
    } else if (intentos === 0) {
        setTimeout(() => {
            alert("GAME OVER. La palabra era: " + palabra.toUpperCase());
            puntaje = 0;
            nivel = 1;
            volverMenu();
        }, 400);
    }
}

function darPista() {
    if (puntaje >= 15) {
        for (let l of palabra) {
            if (!letras.includes(l)) {
                puntaje -= 15;
                let btn = document.getElementById("key-" + l);
                if(btn) btn.disabled = true;
                intentar(l);
                return;
            }
        }
    } else {
        alert("Necesitas al menos 15 puntos para una pista.");
    }
}

function volverMenu() {
    document.getElementById("game").style.display = "none";
    document.getElementById("menu").style.display = "flex";
}

function dibujar() {
    const c = document.getElementById("canvas");
    const ctx = c.getContext("2d");
    ctx.clearRect(0,0,220,260);
    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(30, 240); ctx.lineTo(190, 240); // Base
    
    if (intentos < 6) { ctx.moveTo(50, 240); ctx.lineTo(50, 30); ctx.lineTo(130, 30); ctx.lineTo(130, 60); }
    if (intentos < 5) { ctx.moveTo(150, 80); ctx.arc(130, 80, 20, 0, Math.PI*2); } // Cabeza
    if (intentos < 4) { ctx.moveTo(130, 100); ctx.lineTo(130, 170); } // Cuerpo
    if (intentos < 3) { ctx.moveTo(130, 120); ctx.lineTo(100, 150); } // Brazo L
    if (intentos < 2) { ctx.moveTo(130, 120); ctx.lineTo(160, 150); } // Brazo R
    if (intentos < 1) { ctx.moveTo(130, 170); ctx.lineTo(100, 210); ctx.moveTo(130, 170); ctx.lineTo(160, 210); } // Piernas

    ctx.stroke();
}

particlesJS("particles-js", {
  particles: {
    number: { value: 50 },
    size: { value: 3 },
    line_linked: { enable: true, opacity: 0.2 },
    move: { speed: 1.5 }
  }
});

crearMenu();
</script>

</body>
</html>
